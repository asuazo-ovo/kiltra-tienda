{% extends "panel_base.html" %}
{% from "_panel.html" import subnav %}
{% block titulo %}Configuración{% endblock %}
{% block contenido %}
<h1 style="margin-bottom:14px">Configuración</h1>
{{ subnav(sub) }}
<h2 style="margin-top:0">General</h2>
{% if guardado %}<p class="guardado" role="status">Datos de la tienda guardados.</p>{% endif %}
<form class="form" method="post">
  <div class="campo"><label>Nombre de la tienda</label><input value="{{ tienda.nombre }}" disabled><p class="ayuda">Dirección: {{ request.base_url }}</p></div>
  <div class="campo"><label for="email">Correo de contacto</label><input id="email" name="email" value="{{ tienda.email }}"></div>
  <div class="campo"><label for="horario">Horario de atención</label><input id="horario" name="horario" value="{{ tienda.horario }}"></div>
  <div class="campo"><label for="showroom">Tienda física o retiro</label><input id="showroom" name="showroom" value="{{ tienda.showroom }}"></div>
  <button class="boton" type="submit">Guardar</button>
</form>
{% endblock %}
